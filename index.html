<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.get && !desc.set && desc.configurable !== false) {
            var currentFetch = desc.get.call(window);
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (e) {}
        window.addEventListener(
          'error',
          function (e) {
            if (
              (e.filename && e.filename.indexOf('chrome-extension://') === 0) ||
              (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          },
          true
        );
      })();
    </script>
